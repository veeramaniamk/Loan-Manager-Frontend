name: 🚀 Deploy Angular App on push

on:
  push:
    branches:
      - master # Change to 'main' or your release branch if needed

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Install and Build Project
        run: |
          npm ci
          npm run build

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          dangerous-clean-slate: false
          # Angular application builder outputs static files into dist/loan-manager/browser/
          local-dir: ./dist/loan-manager/browser/
          # Optional: Specify target directory if your server uses public_html or htdocs
          # server-dir: ./public_html/
